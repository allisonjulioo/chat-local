<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f2">
<title>Chat</title>
<link rel="icon" href="/icone.svg">
<link rel="apple-touch-icon" href="/icone.svg">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<main id="app">
  <aside id="lista">
    <nav id="conversas"></nav>
    <div id="eu">
      <button id="alterar-nome"></button>
      <form id="form-nome" hidden>
        <input id="campo-nome" maxlength="40" placeholder="Nome automático" autocomplete="off">
      </form>
    </div>
  </aside>

  <section id="conversa">
    <header id="topo">
      <button id="voltar" aria-label="Voltar para a lista">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div>
        <strong id="titulo"></strong>
        <small id="subtitulo"></small>
      </div>
    </header>
    <div id="mensagens"></div>
    <div id="envios"></div>
    <p id="aviso" hidden></p>
    <form id="form-mensagem">
      <label class="anexar" aria-label="Enviar arquivo" title="Enviar arquivo">
        <input id="campo-arquivo" type="file" multiple hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      </label>
      <textarea id="campo-texto" rows="1" placeholder="Mensagem"></textarea>
      <button id="enviar">Enviar</button>
    </form>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
